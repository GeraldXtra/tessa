# core/config/settings.yaml
#
# Runtime settings for the Tessa Core daemon.
#
# Distinct from permissions.yaml on purpose: that file answers "may this
# happen?" and is the security authority. This one answers "how should the
# daemon behave?" and is tuning.

version: 1

# ── Budget ────────────────────────────────────────────────────────────────────
# TESSA_CORE-spec §6: a nightly budget cap is a HARD STOP, not a warning.
# `budgetCap` and `budgetSpent` ship on every evt.daemon.health frame
# (CONTRACT §4.1).
#
# UNIT: NGN. CONTRACT §4.1 does not state a currency for those two fields —
# a one-line clarification has been proposed to the owner rather than assumed.
budget:
  currency: NGN
  nightly_cap: 3000.0
  # Ledger path, relative to the repo root. Date-keyed, persisted, and rebuilt
  # on startup so a restart mid-evening does not hand back a fresh allowance.
  ledger_path: "data/cost-ledger.jsonl"

# ── Brain ─────────────────────────────────────────────────────────────────────
#
# ONE WORD IS THE WHOLE SWITCH. `engine` selects which adapter answers the
# questions the local router cannot: summarise, explain, teach, do the maths,
# draft something. Everything the router already handles stays local, free and
# instant regardless of what is set here.
#
# A BROKEN engine is never swapped for a working one. If the selected engine
# cannot answer — no key, no network, a rejected model — she SAYS SO, in her own
# voice, and the local tools keep working. A brain that silently swaps itself is
# lying about what answered him, the same objection as an Opus-to-Sonnet
# downgrade nobody was told about.
#
# A SPENT FREE-TIER QUOTA is the one exception, and it is not silent — see
# `fallback` below.
brain:
  engine: gemini            # gemini | anthropic | local

  # ── Quota fallback ──────────────────────────────────────────────────────────
  #
  # Gemini's free tier runs out, daily and per-minute. Without this she simply
  # stops thinking for the rest of the day. With it, a SPENT QUOTA — and only a
  # spent quota, never an error — routes to the local model so she keeps
  # working, and the switch is visible everywhere: `brainEngine` on the health
  # frame, the voice loop's stage log, and a draft's `model` field all report
  # whichever engine actually answered.
  #
  # ⚠ THE LOCAL MODEL IS QWEN2.5-0.5B ON TWO CORES. It is fine at a short
  # answer and bad at writing in his voice, so quality-critical work does NOT
  # quietly use it. See core/brain/llm/fallback.py.
  fallback:
    enabled: true
    backup: local           # which engine answers while the quota is spent
    # What happens when quality-critical work (X drafting) meets a spent quota:
    #   ask   — she says the quota is out and offers the weak model. DEFAULT.
    #   local — write it on the local model anyway. It will not sound like him;
    #           the draft still goes to the same approval card, and `model` on
    #           the card says which brain wrote it.
    #   never — do not write at all until the quota is back.
    drafting: ask
    # A per-minute limit clears itself, so it is waited out rather than fallen
    # back from. Capped, because a voice turn that stalls is a broken one.
    transient_max_wait_s: 8.0
    transient_retries: 1
    # After a daily exhaustion, how long before the next REAL call tries Gemini
    # again (there is no separate probe call — spending quota to ask whether
    # there is quota is the one thing a free tier cannot afford).
    recheck_after_s: 1800

  # ── Brain-driven intent (2026-09-22) ───────────────────────────────────────
  #
  # What the regex router cannot place, or is not sure of, goes to the model
  # with the catalogue of her tools, and the model returns the tool he MEANT
  # plus structured arguments — "open X so I can login", "bring up X", "show my
  # feed" all resolve instead of dead-ending on "give me the full path". The
  # fast path still answers first and for free; this costs one model call
  # (~3.5 s) only at its edges. Every call the model builds is origin=agent:
  # the card, the hold, the fence and the chain treat it as model-built.
  # `enabled: false` restores the old dead ends exactly. core/brain/intent_model.py.
  intent:
    enabled: true
    max_tokens: 220
    # ITS OWN MODEL, ITS OWN QUOTA. The free tier caps requests per day PER
    # MODEL, and the first live run spent gemini-3.6-flash's cap in an
    # afternoon. Intent goes to the lite model — measured 2026-09-22: valid
    # JSON for 7 of 7 utterances in 3–5 s on the full catalogue — so working
    # out what he meant never eats the quota he talks to her on. Empty = use
    # the brain above. Same engine family and key; built by the same selector.
    model: gemini-3.1-flash-lite
    # The local 0.5B model took 138 s for one pick and got it wrong. Off.
    allow_local: false

  gemini:
    # Free tier, no card. The key is read from the ENVIRONMENT and never
    # stored here — a settings file is checked into a repo and a key is not.
    api_key_env: GEMINI_API_KEY
    # PINNED, NOT `gemini-flash-latest`. An alias that moves under him is a
    # silent brain change, which is the one thing this module exists to
    # prevent — and the alias also READ-TIMED OUT when probed, while the pinned
    # ids answered in under three seconds.
    #
    # THE LISTING LIES, so these were measured rather than chosen. `ListModels`
    # returns 38 models supporting generateContent; several of them 404 with
    # "no longer available to new users" — `gemini-2.0-flash`, `gemini-2.5-flash`
    # and `gemini-2.5-flash-lite` all did, on his key, on 2026-08-14. Probed
    # end-to-end, these two answered:
    #     gemini-3.6-flash        2.53 s
    #     gemini-3.1-flash-lite   1.72 s
    #     (gemini-3.5-flash worked but took 8.52 s — too slow to speak over)
    # `python -m core.brain.llm.gemini --probe` re-runs that measurement.
    models:
      main: gemini-3.6-flash
      classify: gemini-3.1-flash-lite

  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    models:
      main: claude-opus-5
      classify: claude-haiku-4-5-20251001
      fallback: claude-sonnet-5

  local:
    # ALREADY ON DISK from the earlier attempt. Downloads nothing.
    # Measured on this machine: 10.6 tok/s idle, 0.9 tok/s with the Orb
    # running. It is the offline fallback, not a daily brain, and the two
    # cores are why — not the model.
    repo: jncraton/Qwen2.5-0.5B-Instruct-ct2-int8
    compute_type: int8
    threads: 4

# ── Health heartbeat ──────────────────────────────────────────────────────────
health:
  # evt.daemon.health cadence. CONTRACT §4.1 says every 5 s.
  interval_s: 5

  # The reachability probe is NOT run on every heartbeat.
  #
  # Three reasons, all of which matter on this machine: the connection is
  # metered, a probe every 5 s is 17,280 requests a day for one boolean, and a
  # blocking check inside the beat would stall the heartbeat the Orb renders
  # from. So it runs at most once per this interval and every beat in between
  # reports the cached value.
  api_probe_interval_s: 60

  # Probed with a plain TCP connect, NOT an HTTP request and NOT an API call:
  # it needs no API key, sends no payload, and costs a few hundred bytes of
  # handshake. `apiReachable` answers "is the network there", not "is my key
  # valid" — conflating those would make a billing problem look like an outage.
  api_probe_host: "api.anthropic.com"
  api_probe_port: 443
  api_probe_timeout_s: 2.0

# ── PTY grants ────────────────────────────────────────────────────────────────
# CONTRACT §6.5: a grant covers one session, one directory, and expires.
pty:
  # Generous for a spawn (~85 ms observed for the worker probe plus spawn),
  # far too short to be useful to anything sitting on a captured grantId.
  grant_ttl_s: 30
  # How often to drop unredeemed grants past their deadline.
  grant_sweep_interval_s: 15

# ── voice: push-to-talk segment boundary ──────────────────────────────────────
# Gerald pressed the chord five times not knowing it toggled. VAD ends the
# segment when he stops, so he presses ONCE. A second press still ends it
# immediately - the manual override outranks the automatic one.
voice:
  # End the segment after this much quiet.
  #
  # RAISED FROM 1200 BECAUSE IT WAS CUTTING HIM OFF. His words: "when giving her
  # instructions it seems she has a few seconds then stops listening."
  #
  # MEASURED, on his own recorded segments, replaying the live decision block by
  # block. seg-160002 — a real turn where he paused mid-instruction — closed
  # early at 1200 ms and survives to the end at 2500 ms. The room clip
  # (seg-154456: 2.5 s of speech then 17 s of empty room) still closes promptly
  # at 6.70 s, so patience did not become permanence.
  #
  # I TESTED THE OTHER TWO CANDIDATES AND REJECTED BOTH:
  #   * lowering `vad_floor_rms` changes nothing — for his normal speaking voice
  #     the RELATIVE term sets the bar (397-573 RMS), so floor=60 and floor=300
  #     cut off exactly the same clips;
  #   * decaying `loudest` over a trailing window made seg-160002 WORSE, closing
  #     it at 11.75 s where the all-time maximum let it run.
  #
  # THE COST is that she starts ~1.3 s later after he finishes. He was explicit:
  # he would far rather wait a second than be cut off.
  vad_silence_ms: 2500
  # RMS above which a block counts as speech. Measured ambient here is ~74
  # (-33.8 dBFS); his speech measured 2966. 300 is 4x the floor.
  vad_floor_rms: 300
  # Never record longer than this, whatever the room is doing.
  vad_hard_cap_s: 20
  # false = press once and it ends on silence. true = the old toggle.
  require_second_press: false

  # ── the conversation session ────────────────────────────────────────────────
  #
  # HIS WORDS: "After doing the task, she should be up for listening for the
  # next task. I don't want to be toggling to talk all the time." And: "No
  # session closing on silence. I will be the one to tell her the task is done."
  #
  # So a session opens on the wake phrase OR the chord, survives any number of
  # turns, and closes only when he says so. There is deliberately NO idle
  # timeout here to configure, because he ruled one out.
  session:
    # false = every utterance needs its own trigger (the old behaviour).
    # true  = one wake, then a conversation until he closes it.
    enabled: true

    # Refuse to open a session when speaker verification is unavailable or he
    # has no voiceprint.
    #
    # FALSE BY DEFAULT, AND THE REASON IS HIS SITUATION RATHER THAN LAXITY.
    # He is alone in his flat. Refusing to listen because a model failed would
    # take his assistant away over an infrastructure fault, mid-task, with no
    # way for him to talk his way out of it. The audit records that a session
    # ran unverified, so the fact is not hidden.
    #
    # SET THIS TRUE IF HE EVER USES IT IN A SHARED SPACE. There the trade
    # reverses: an unverified open microphone in a room of people is worse than
    # an assistant that says it cannot listen right now.
    require_verification: false

  # ── wake phrase ─────────────────────────────────────────────────────────────
  #
  # THE SWAP IS ONE LINE. `model` is the only thing that changes when Gerald
  # brings a Colab-trained hey_tessa.onnx back — no code, no rebuild.
  #
  # WHY IT SHIPS AGAINST hey_jarvis: openWakeWord has no "Hey Tessa" model and one
  # cannot be trained here. The full set is alexa, hey_jarvis, hey_mycroft,
  # hey_rhasspy plus two command models. Training needs the `full` extra (torch +
  # tensorflow-cpu 2.8.1 + datasets) and GB-scale negative corpora on 2 cores
  # with no GPU. hey_jarvis is the PROXY the plumbing was measured against;
  # the per-frame cost is identical whatever the phrase is.
  #
  # MEASURED: 0.6% of this 2-core machine, p95 inference 9.31 ms against an 80 ms
  # frame budget, and 0 of 46 frames late while a Whisper transcription
  # saturated the box at 77%.
  wake:
    # ⚠ OFF BY THE OWNER'S CHOICE — HE DOES NOT WANT "HEY JARVIS".
    #
    # Briefly true. The wake word works, and the diagnosis behind that is worth
    # keeping: nothing fired because this flag was false, so `core/server.py`
    # skipped the whole WakeDetector block and the detector was never
    # CONSTRUCTED — no model, no frames, no log line. Turning it on fixes that.
    #
    # But the only wake model on this machine is openWakeWord's bundled
    # hey_jarvis_v0.1.onnx, and openWakeWord ships no "Hey Tessa" — so enabling
    # it makes her answer to a name that is not hers. He would rather use the
    # typed Console until her own name works. That is a preference, not a
    # defect, and it is the right call: a wrong name answering is worse than
    # nothing for an assistant he talks to every day.
    #
    # RE-ENABLE WHEN `data/models/wake/hey_tessa.onnx` EXISTS (Colab-trained —
    # openWakeWord's own notebook, ~1 hour, free tier, ~1.2 MB out). Put its
    # path in `model` below and set this back to true. No code change: the
    # loader already handles a configured path, and `scripts/wake-check.py`
    # will report the new phrase and the scores his voice actually produces so
    # `threshold` can be tuned from a measurement rather than a guess.
    enabled: false

    # Absolute path or repo-relative path to a .onnx. Empty = the bundled
    # hey_jarvis proxy. Put his Colab output at data/models/wake/hey_tessa.onnx
    # and name it here.
    model: ""

    # Confidence to fire at. 0.5 is openWakeWord's calibrated operating point.
    #
    # TUNE IT ASYMMETRICALLY. A false wake costs a sphere lighting up and a
    # segment that transcribes to nothing. A missed wake costs the feature.
    # Prefer too sensitive over too deaf.
    threshold: 0.5

    # Ignore the detector for this long after it fires. Without it one utterance
    # fires on several consecutive frames and she arms, disarms and re-arms
    # mid-sentence.
    refractory_s: 2.0

    # What she does on waking. Spec §4 allows 200 ms.
    #
    # false = the state transition alone (evt.agent.state -> listening), which
    # the Orb already renders and which costs ~0 ms.
    # true  = a generated 80 ms blip as well, played BEFORE arming.
    #
    # THE ORDERING IS LOAD-BEARING, not cosmetic. The VAD tracks `loudest` over
    # captured audio only, never the pre-roll. A chime played BEFORE the arm
    # lands in the pre-roll and is invisible to it; played AFTER, it would raise
    # `loudest`, which raises the relative silence threshold, which makes her
    # slower to notice he stopped talking.
    chime: false

# ── Style learning (core/brain/style.py) ─────────────────────────────────────
#
# HOW people write, learned as measured patterns from the posts she reads on
# X: length, casing, punctuation, emoji, and the single words they reuse.
# Never WHAT they said — the store holds counters and single tokens only, so
# it cannot carry a claim. Toxic and instruction-shaped posts teach shape and
# no words. It feeds her chat register and, from his own posts only, X drafts.
style:
  enabled: true
  # His X handle, with or without the @. Posts from this handle feed the
  # "owner" corpus that sharpens X drafts; every other post feeds "others",
  # which only loosens chat rhythm and vocabulary. Left empty, the handle he
  # gave "learn my voice from X" is used; if neither is set, nothing is his.
  owner_handle: ""

# ── Claim filter (core/brain/relevance.py) ────────────────────────────────────
#
# WHICH claims she bothers to keep. Every post she reads on X is a claim
# (core/brain/claims.py) and a timeline is mostly rage-bait, so this keeps
# only the posts about HIS topics: what he has said to her lately (the thread,
# read and never written) and the topics listed here in his own words.
#
# ⚠ RELEVANCE IS NEVER TRUTH. This decides note-or-skip and nothing else. A
# kept claim is exactly as UNVERIFIED as it was before this filter existed,
# and only his own confirmation ever changes that. A post cannot vote itself
# relevant or trusted: the score is computed from his words, not the post's.
claims:
  filter:
    # false = Stage 1 behaviour: every claim from every read is noted.
    enabled: true
    # Topics in his own words, e.g. ["naira", "Titan Wave", "Aptech"]. One
    # hit keeps a claim; a multi-word topic needs all of its words. Empty is
    # fine: the thread alone then decides.
    topics: []
    # A post is kept when its score reaches this: 2 per listed topic it
    # contains, plus, for each topic word it shares with his recent turns,
    # the number of his turns that used that word (capped at 2). So 2 = one
    # listed topic, or one word he has come back to twice, or two words he
    # used once each. 1 keeps anything sharing a single word with him (more
    # noise kept); 3 keeps only what he clearly keeps talking about. With no
    # topics known at all nothing is kept, and the audit chain says so.
    min_score: 2
