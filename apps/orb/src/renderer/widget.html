<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--%CSP%-->
    <title>Tessa</title>
    <style>
      /*
        EVERY LAYER MUST BE TRANSPARENT, NOT JUST THE WINDOW.

        `transparent: true` on the BrowserWindow only makes the native surface
        capable of transparency. If html, body or the canvas paints an opaque
        background — and the default UA stylesheet gives body a white one — the
        corner is a solid rectangle and the window flag looks broken. This is
        the second half of the transparency, and it is the half that is easy to
        forget because the window options are where you go looking.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* The window is click-through except over the disc; the page must not
           add its own cursor or selection affordances anywhere. */
        user-select: none;
        cursor: default;
      }
      #orb {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      /* Only the disc is a pointer. The corners of the square are see-through
         and clicks there go to whatever is underneath. */
      #orb.over {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="orb"></canvas>
    <script type="module" src="./widget.ts"></script>
  </body>
</html>
